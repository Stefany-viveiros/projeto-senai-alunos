<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carteirinha - {{ aluno.nome }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/carteirinha.css') }}">
</head>
<body>
    <div class="faixa-topo"></div>

    <nav class="navbar">
        <div class="navbar-container">
            <div class="logo-senai">
                <img src="{{ url_for('static', filename='img/logoSenai.jpg') }}" alt="Logo SENAI">
                <span>ALUNOS</span>
            </div>

            <ul class="nav-links">
                <li><a href="{{ url_for('home') }}">Home</a></li>
                <li><a href="{{ url_for('sobre') }}">Sobre</a></li>
                <li><a href="{{ url_for('carteirinha') }}" class="active">Carteirinha</a></li>
                <li><a href="{{ url_for('cadastro') }}">Cadastro</a></li>
                <li><a href="{{ url_for('login') }}">Login</a></li>
            </ul>
        </div>
    </nav>

    <main class="carteirinha-container">
        <div class="carteirinha">
            <div class="carteirinha-header">
                <img src="{{ url_for('static', filename='img/logoSenai.jpg') }}" alt="Logo SENAI" class="logo">
                <h2>Carteirinha de Estudante</h2>
            </div>

            <div class="carteirinha-body">
                <div class="foto-aluno">
                    <img src="{{ url_for('static', filename='uploads/' + aluno.foto) }}" alt="Foto do aluno">
                </div>
                <div class="dados-aluno">
                    <p><strong>Nome:</strong> {{ aluno.nome }}</p>
                    <p><strong>RA:</strong> {{ aluno.ra }}</p>
                    <p><strong>Curso:</strong> {{ aluno.curso }}</p>
                    <p><strong>Turma:</strong> {{ aluno.turma }}</p>
                </div>
                <div class="qr-code">
                    <img src="{{ url_for('static', filename='qrcodes/' + aluno.qr_code) }}" alt="QR Code">
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="footer-container">
            <p>Desenvolvido pelos alunos do SENAI</p>
            <p>Leandro de Souza | Nicolas Eduardo | Stefany Viveiros
                <span>© 2025</span>
            </p>
        </div>
    </footer>
</body>
</html>
